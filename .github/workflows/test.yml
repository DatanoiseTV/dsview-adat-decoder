name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests

  python37-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse the decoder as Python 3.7
        run: |
          python - <<'PY'
          import ast, glob
          for path in sorted(glob.glob('adat/*.py')):
              ast.parse(open(path).read(), filename=path, feature_version=(3, 7))
              print('ok', path)
          PY
